spring.application.name=experience-service
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/experience_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Eureka - demonstration locale sur une meme machine
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/,http://127.0.0.1:8762/eureka/
eureka.client.healthcheck.enabled=true

eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator - demonstration locale
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informations du microservice
info.app.name=experience-service
info.app.description=Gestion des experiences HiddenPath
info.app.version=0.0.1-SNAPSHOT