
spring.application.name=itinerary-service
spring.jpa.open-in-view=false

# Server
server.port=8085

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/itinerary_db
spring.datasource.username=hiddenpath
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance Configuration
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Health and Info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=itinerary-service
info.app.description=HiddenPath Smart Itinerary Microservice
