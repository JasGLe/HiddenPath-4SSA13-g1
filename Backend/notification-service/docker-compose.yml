services:
  mongodb:
    image: mongo:8
    container_name: hiddenpath-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: hiddenpath-notification
    restart: unless-stopped
    ports:
      - "8099:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: notification_db
      MongoDb__CollectionName: notifications
      Eureka__Client__ServiceUrl: http://host.docker.internal:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data: