spring.application.name=user-reputation-service
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5433/user_reputation_db
spring.datasource.username=hiddenpath
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.health.rabbit.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/hiddenpath

# Eureka - demonstration locale sur une meme machine
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/,http://127.0.0.1:8762/eureka/
eureka.client.healthcheck.enabled=true

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Health endpoint
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Application information
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=HiddenPath Microservice
info.app.version=1.0.0